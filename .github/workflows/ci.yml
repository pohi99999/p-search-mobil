name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-env supabase/functions/increment-search-count/
      - run: deno test --allow-env supabase/functions/trigger-n8n-webhook/
      - run: deno test --allow-env supabase/functions/delete-account/
      - run: deno test --allow-env supabase/functions/vies-check/
      - run: deno test --allow-read supabase/functions/_shared/
      - run: deno test --allow-env --allow-read supabase/functions/generate-document/
      # Card [K] (review 2026-10-25): these suites existed and passed but never ran in CI; match-grants is new.
      - run: deno test --allow-env --allow-read supabase/functions/backfill-grant-chunks/
      - run: deno test --allow-env --allow-read supabase/functions/generate-action-plan/
      - run: deno test --allow-env --allow-read supabase/functions/revenuecat-webhook/
      - run: deno test --allow-env supabase/functions/match-grants/
      - run: deno test --allow-env supabase/functions/chat-with-gemini/
