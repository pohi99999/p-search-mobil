<!DOCTYPE html>
<!-- The web build's page (Expo, output "single"): Expo's own template, in Hungarian. lang="hu" so a screen reader
     reads the app with a Hungarian voice; the default was lang="en" (measured 2026-11-13). -->
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>P-Search</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      A P-Search használatához engedélyezd a JavaScriptet a böngésződben.
    </noscript>
    <div id="root"></div>
  </body>
</html>
