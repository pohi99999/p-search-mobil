<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>P-Search: új jelszó beállítása</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; margin: 0; padding: 24px; color: #212121; }
  .card { max-width: 420px; margin: 40px auto; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size: 1.25rem; color: #1A237E; margin: 0 0 8px; }
  p { line-height: 1.45; }
  label { display: block; font-size: .9rem; margin: 14px 0 6px; }
  input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #bbb; border-radius: 8px; font-size: 1rem; }
  button { width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 8px; background: #1976D2; color: #fff; font-size: 1rem; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: default; }
  .msg { margin-top: 14px; padding: 12px; border-radius: 8px; font-size: .95rem; }
  .ok { background: #E8F5E9; color: #1B5E20; }
  .err { background: #FFEBEE; color: #B71C1C; }
  .hint { color: #666; font-size: .85rem; }
</style>
</head>
<body>
<div class="card">
  <h1>P-Search: új jelszó beállítása</h1>
  <p id="intro">A jelszó-visszaállító levél linkje hozta ide. Add meg az új jelszavad, utána az alkalmazásban ezzel tudsz belépni.</p>
  <form id="f" hidden>
    <label for="p1">Új jelszó (legalább 8 karakter)</label>
    <input id="p1" type="password" minlength="8" autocomplete="new-password" required>
    <label for="p2">Új jelszó még egyszer</label>
    <input id="p2" type="password" minlength="8" autocomplete="new-password" required>
    <button id="btn" type="submit">Jelszó mentése</button>
  </form>
  <div id="msg" class="msg" hidden></div>
  <p class="hint">Ez az oldal csak a jelszót állítja be a saját fiókodhoz. Ha nem te kérted a visszaállítást, zárd be az oldalt, semmi nem történik.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var URL_ = 'https://icextvgecinmhrhjtfcm.supabase.co';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljZXh0dmdlY2lubWhyaGp0ZmNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5OTU2NTEsImV4cCI6MjA5NjU3MTY1MX0.o6qQ3Op5MLv2_zfjqcmptkTqm2smE0F5lDdFWQi0ipE';
  var f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('btn'), intro = document.getElementById('intro');
  function show(text, ok) { msg.textContent = text; msg.className = 'msg ' + (ok ? 'ok' : 'err'); msg.hidden = false; }
  var hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (hash.get('error')) {
    show('A link már nem érvényes (' + (hash.get('error_description') || hash.get('error')) + '). Kérj új jelszó-visszaállító levelet az alkalmazásból.', false);
    return;
  }
  var client = supabase.createClient(URL_, ANON, { auth: { detectSessionInUrl: true, persistSession: false } });
  var ready = false;
  function armed() { ready = true; f.hidden = false; }
  client.auth.onAuthStateChange(function (event, session) {
    if ((event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') && session) armed();
  });
  setTimeout(function () {
    if (ready) return;
    client.auth.getSession().then(function (r) {
      if (r.data && r.data.session) armed();
      else show('Nincs érvényes visszaállító munkamenet. Nyisd meg a levélben kapott linket ugyanebben a böngészőben, vagy kérj új levelet.', false);
    });
  }, 1500);
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
    if (p1.length < 8) { show('A jelszó legalább 8 karakter legyen.', false); return; }
    if (p1 !== p2) { show('A két jelszó nem egyezik.', false); return; }
    btn.disabled = true;
    client.auth.updateUser({ password: p1 }).then(function (r) {
      if (r.error) { show('Nem sikerült menteni: ' + r.error.message, false); btn.disabled = false; return; }
      f.hidden = true; intro.hidden = true;
      show('Kész. Az új jelszóval most már be tudsz lépni a P-Search alkalmazásban.', true);
      client.auth.signOut();
    });
  });
})();
</script>
</body>
</html>
